<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>WarpTalk Skeleton</title>
    <style>
        body {
            margin: 0;
            font-family: sans-serif;
        }

        .app-container {
            display: flex;
            height: 100vh;
            width: 100vw;
        }

        /* Left Column: Navigation Sidebar */
        .sidebar {
            width: 250px;
            display: flex;
            flex-direction: column;
            border-right: 1px solid black;
        }

        .rooms-section {
            flex: 1;
            border-bottom: 1px solid black;
            overflow-y: auto;
        }

        .dms-section {
            flex: 1;
            overflow-y: auto;
        }

        /* Middle and Right Columns: Slot 1 and Slot 2 */
        .slot {
            flex: 1;
            display: flex;
            flex-direction: column;
            border-right: 1px solid black;
        }

        .slot-header {
            height: 50px;
            border-bottom: 1px solid black;
        }

        .slot-messages {
            flex: 1;
            overflow-y: auto;
            border-bottom: 1px solid black;
        }

        .slot-media-links {
            height: 150px;
            border-bottom: 1px solid black;
        }

        .slot-input-area {
            height: 60px;
            border-bottom: 1px solid black;

        }
    </style>
</head>

<body>

    <div class="app-container">
        <div class="sidebar">
            <div class="rooms-section">
                <h3>Rooms</h3>
            </div>
            <div class="dms-section">
                <h3>Direct Messages</h3>
            </div>
        </div>

        <div class="slot">
            <div class="slot-header">Room Header / Details</div>
            <div class="slot-messages">Chat Messages Area</div>
            <div class="slot-input-area">Message Input Bar</div>
            <div class="slot-media-links">Media & Links View</div>
        </div>

        <div class="slot">
            <div class="slot-header">Room Header / Details</div>
            <div class="slot-messages">Chat Messages Area</div>
            <div class="slot-input-area">Message Input Bar</div>
            <div class="slot-media-links">Media & Links View</div>
        </div>
    </div>

</body>

</html>
