<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>WarpTalk Skeleton</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://warp.cs.au.dk/libs/warptalk.js" type="application/javascript"></script>

</head>

<body>

    <div class="app-container">
        <div class="sidebar">
            <div class="rooms-section">
                <h3>Rooms</h3>
                <button class="login-out-btn">Login</button>
                <ul class="room-list"></ul>
            </div>
            <div class="dms-section">
                <h3>Direct Messages</h3>
            </div>
        </div>

        <div class="slot" id="slot-1">
            <div class="slot-header">Room 1 Header / Details</div>
            <div class="slot-messages">Chat Messages Area</div>
            <div class="slot-input-area">Message Input Bar
                <input type="text" class="slot1-input">
            </div>
            <div class="slot-media-links">Media & Links View</div>
        </div>

        <div class="slot" id="slot-2">
            <div class="slot-header">Room 2 Header / Details</div>
            <div class="slot-messages">Chat Messages Area</div>
            <div class="slot-input-area">Message Input Bar
                <input type="text" class="slot2-input">
            </div>
            <div class="slot-media-links">Media & Links View</div>
        </div>
    </div>
    <script src="chat.js"></script>
</body>

</html>
